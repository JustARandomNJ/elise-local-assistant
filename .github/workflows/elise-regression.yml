name: Elise Regression

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      groups:
        description: "Optional comma-separated offline regression groups"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: "elise-regression-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  offline-regression:
    name: Offline regression
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-ci.txt

      - name: Show environment
        shell: pwsh
        run: |
          python --version
          python -c "import ollama; print('ollama client import passed')"

      - name: Run complete offline regression suite
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.groups == '' }}
        shell: pwsh
        run: |
          python regression_suite.py `
            --json-report regression_reports/github-actions.json

      - name: Run selected offline regression groups
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.groups != '' }}
        shell: pwsh
        env:
          REGRESSION_GROUPS: ${{ inputs.groups }}
        run: |
          python regression_suite.py `
            --group "$env:REGRESSION_GROUPS" `
            --json-report regression_reports/github-actions.json

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "elise-regression-${{ github.run_number }}"
          path: regression_reports/github-actions.json
          if-no-files-found: warn
          retention-days: 14
